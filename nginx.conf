server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml text/markdown
               image/svg+xml;

    # --- hashed build assets: cache forever ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- API (kgmcloud-api container, must be linked in the same Cosmos network) ---
    # resolver + variable makes nginx re-resolve the container IP per request,
    # so recreating kgmcloud-api never breaks the proxy
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kgm_api http://kgmcloud-api:3000;
        proxy_pass $kgm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- product images & uploads (shared volume mounted read-only) ---
    location /media/ {
        alias /media-data/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
